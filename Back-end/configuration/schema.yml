openapi: 3.0.3
info:
  title: API Gestion Immobilier
  version: 1.0.0
  description: Documentation de l'API REST  cahier des charges Master II
paths:
  /api/admin/dashboard/:
    get:
      operationId: admin_dashboard_retrieve
      tags:
      - admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/agent/dashboard/:
    get:
      operationId: agent_dashboard_retrieve
      tags:
      - agent
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/agents/register/:
    post:
      operationId: agents_register_create
      description: |-
        Inscription des agents immobiliers.
        RG : un compte AGENT est créé inactif et doit être validé par un
        administrateur avant de pouvoir se connecter.
      tags:
      - agents
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Connexion utilisateur — retourne un couple (access, refresh) de tokens JWT
        ainsi que le profil de l'utilisateur connecté.

        Utilise UtilisateurTokenObtainPairSerializer (déjà défini dans
        serializers.py), qui enrichit le payload du token avec le rôle et
        ajoute le profil utilisateur dans la réponse.

        RG-04 : un compte désactivé (is_active=False) ne peut plus se connecter —
        ce comportement est garanti nativement par TokenObtainPairSerializer,
        qui vérifie `user.is_active` avant d'émettre un token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtilisateurTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UtilisateurTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UtilisateurTokenObtainPair'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilisateurTokenObtainPair'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Déconnexion utilisateur — blackliste le refresh token transmis
        (rest_framework_simplejwt.token_blacklist doit être dans INSTALLED_APPS).

        Le client doit envoyer son refresh token dans le corps de la requête :
            POST /api/auth/logout/
            { "refresh": "<refresh_token>" }
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
