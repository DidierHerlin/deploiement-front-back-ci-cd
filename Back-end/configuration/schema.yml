  /api/contrats/:
    get:
      operationId: contrats_list
      description: |-
        CRUD complet sur les contrats (location et achat), avec actions
        métier dédiées :

            GET  /contrats/bien_info/?bien_id=<id>   Infos d'un bien DISPONIBLE
            POST /contrats/{id}/resilier/            Location ACTIF -> RESILIE
            POST /contrats/{id}/terminer/            Location ACTIF -> TERMINE
            POST /contrats/{id}/finaliser_vente/     Achat ACTIF -> VENDU
            GET  /contrats/echeances/                Liste des échéances à venir (J-5)
      parameters:
      - in: query
        name: bien
        schema:
          type: integer
      - in: query
        name: locataire
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: statut
        schema:
          type: string
          enum:
          - ACTIF
          - RESERVE
          - RESILIE
          - TERMINE
          - VENDU
        description: |-
          * `RESERVE` - Réservé
          * `ACTIF` - Actif
          * `RESILIE` - Résilié
          * `TERMINE` - Terminé
          * `VENDU` - Vendu
      - in: query
        name: type_contrat
        schema:
          type: string
          title: Type de contrat
          enum:
          - ACHAT
          - LOCATION
        description: |-
          * `LOCATION` - Location
          * `ACHAT` - Achat
      tags:
      - contrats
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContratListList'
          description: ''
