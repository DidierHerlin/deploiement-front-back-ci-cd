sonar.projectKey=gestion-immobiliere
sonar.organization=didierherlin
sonar.projectName=Gestion Immobiliere Backend
sonar.projectVersion=1.0
# Sources analysees (le code metier uniquement)
sonar.sources=.
sonar.language=py

# Tests declares separement : exclus du calcul de duplication et de couverture
sonar.tests=.
sonar.test.inclusions=**/test_*.py,**/tests.py,**/tests_*.py,test_reporting.py

# Exclure les fichiers qui ne necessitent pas d'analyse qualité
sonar.exclusions=**/migrations/**,**/__pycache__/**,**/.pytest_cache/**,manage.py,**/settings.py,settings.py,wsgi.py,asgi.py,**/test_*.py,**/tests.py,**/tests_*.py,test_reporting.py,test_runner.py,performance_test.py,check_user.py,scratch/**,**/media/**,coverage.xml,.coverage,**/*.log,**/*.txt,**/.venv/**,**/venv/**
sonar.cpd.exclusions=**/migrations/**,**/test_*.py,**/tests.py,**/tests_*.py,test_reporting.py,**/admin.py,**/apps.py,**/urls.py
sonar.coverage.exclusions=**/migrations/**,**/test_*.py,**/tests.py,**/tests_*.py,test_reporting.py,test_runner.py,performance_test.py,check_user.py,scratch/**,manage.py,**/settings.py,settings.py,wsgi.py,asgi.py,**/admin.py,**/apps.py,**/urls.py,**/__init__.py

# Integration du rapport de couverture genéré par coverage.py
# sonar-scanner cherchera ce fichier XML pour remonter la couverture dans SonarQube
sonar.python.coverage.reportPaths=coverage.xml

# Encodage
sonar.sourceEncoding=UTF-8
