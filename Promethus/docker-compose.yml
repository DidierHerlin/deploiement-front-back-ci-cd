    version: '3.8'
    services:
      prometheus:
        image: prom/prometheus:latest
        ports:
          - "9090:9090"
        volumes:
          - ./prometheus.yml:/etc/prometheus/prometheus.yml
        extra_hosts:
          - "host.docker.internal:host-gateway"

      grafana:
        image: grafana/grafana:latest
        ports:
          - "3001:3000" # J'utilise 3001 au cas où votre frontend local tourne déjà sur 3000
        depends_on:
          - prometheus