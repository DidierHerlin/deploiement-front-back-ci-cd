name: CI - Gestion Immobilier Back-end
on:
  push:
    branches: [main]
    paths:
      - 'Back-end/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Back-end/**'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gestion_immobilier_back_end
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gestion_immobilier_back_end"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: test-secret-key
      DEBUG: "True"
      DB_NAME: gestion_immobilier_back_end
      DB_USER: postgres
      DB_PASSWORD: ""
      DB_HOST: localhost
      DB_PORT: "5432"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      TIME_ZONE: UTC
      ACCESS_TOKEN_LIFETIME_MIN: "30"
      REFRESH_TOKEN_LIFETIME_DAYS: "7"
      FRONTEND_URL: http://localhost:3000
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: noreply@local.test

    defaults:
      run:
        working-directory: ./Back-end/configuration

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Vérifier la configuration Django
        run: python manage.py check

      - name: Lancer les tests Django
        run: python manage.py test

      - name: Sauvegarder le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Back-end/configuration/coverage.xml

  code-quality:
    needs: backend-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupérer le rapport de couverture
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: Back-end/configuration/

      - name: Analyse SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: ./Back-end/configuration
          args: >-
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/test_*.py,**/tests.py,**/tests_*.py,test_reporting.py
            -Dsonar.python.version=3.11
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=**/migrations/**,**/__pycache__/**,**/.pytest_cache/**,manage.py,**/settings.py,settings.py,wsgi.py,asgi.py,**/test_*.py,**/tests.py,**/tests_*.py,test_reporting.py,test_runner.py,performance_test.py,check_user.py,scratch/**,**/media/**,coverage.xml,.coverage,**/*.log,**/*.txt,**/.venv/**,**/venv/**
            -Dsonar.cpd.exclusions=**/migrations/**,**/test_*.py,**/tests.py,**/tests_*.py,test_reporting.py,**/admin.py,**/apps.py,**/urls.py
            -Dsonar.coverage.exclusions=**/migrations/**,**/test_*.py,**/tests.py,**/tests_*.py,test_reporting.py,test_runner.py,performance_test.py,check_user.py,scratch/**,manage.py,**/settings.py,settings.py,wsgi.py,asgi.py,**/admin.py,**/apps.py,**/urls.py,**/__init__.py
            -Dsonar.sourceEncoding=UTF-8

  docker-publish:
    needs: [backend-tests, code-quality]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/immobilier-drf

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Back-end/configuration
          file: ./Back-end/configuration/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/immobilier-drf:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/immobilier-drf:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploiement-AWS:
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion et déploiement sur AWS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_HOST: ${{ secrets.AWS_RDS_ENDPOINT }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_NAME: "postgres"
          DB_USER: "postgres"
          DB_PORT: "5432"
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          AWS_EC2_IP: ${{ secrets.AWS_EC2_IP }}
          ENABLE_HPA: ${{ secrets.ENABLE_HPA }}
          GIT_SHA: ${{ github.sha }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/immobilier-drf:${{ github.sha }}
        with:
          host: ${{ secrets.AWS_EC2_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          envs: DB_HOST, DB_PASSWORD, SECRET_KEY, DB_NAME, DB_USER, DB_PORT, DOCKERHUB_USERNAME, AWS_EC2_IP, ENABLE_HPA, GIT_SHA, DOCKER_IMAGE
          script: |
            # ── Mode verbose : affiche chaque commande + stoppe sur erreur ──
            set -ex

            # Installation automatique de k3s s'il n'est pas présent
            if ! command -v k3s &> /dev/null; then
                echo "📦 Installation de K3s..."
                curl -sfL https://get.k3s.io | sh - 2>&1 | tail -5
                sleep 10
            else
                echo "✅ K3s déjà installé : $(k3s --version)"
            fi
            
            # Création du namespace
            echo "🔧 Création du namespace immobilier..."
            sudo k3s kubectl create namespace immobilier --dry-run=client -o yaml | sudo k3s kubectl apply -f -
            
            # Mise à jour des secrets Kubernetes
            echo "🔑 Mise à jour des secrets RDS..."
            sudo k3s kubectl delete secret backend-secrets -n immobilier --ignore-not-found
            sudo k3s kubectl create secret generic backend-secrets \
              --from-literal=DB_NAME=$DB_NAME \
              --from-literal=DB_USER=$DB_USER \
              --from-literal=DB_PASSWORD=$DB_PASSWORD \
              --from-literal=DB_HOST=$DB_HOST \
              --from-literal=DB_PORT=$DB_PORT \
              --from-literal=SECRET_KEY=$SECRET_KEY \
              --from-literal=ALLOWED_HOSTS="*" \
              --from-literal=CORS_ALLOWED_ORIGINS="http://$AWS_EC2_IP:3000,http://localhost:3000" \
              --from-literal=CSRF_TRUSTED_ORIGINS="http://$AWS_EC2_IP:3000,http://localhost:3000" \
              --namespace=immobilier
            
            # Création à la volée du fichier de déploiement optimisé
            # NOTE : heredoc SANS guillemets autour de EOF → $DOCKER_IMAGE est interpolé par le shell
            cat << EOF > backend-deployment.yaml
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: backend
              namespace: immobilier
            spec:
              replicas: 1
              strategy:
                type: RollingUpdate
                rollingUpdate:
                  maxSurge: 1
                  maxUnavailable: 0
              selector:
                matchLabels:
                  app: backend
              template:
                metadata:
                  labels:
                    app: backend
                spec:
                  containers:
                    - name: backend
                      image: $DOCKER_IMAGE
                      imagePullPolicy: Always
                      command: ["sh", "-c", "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 --workers 2 wsgi:application"]
                      ports:
                        - containerPort: 8000
                      resources:
                        requests:
                          memory: "150Mi"
                          cpu: "100m"
                        limits:
                          memory: "250Mi"
                          cpu: "400m"
                      readinessProbe:
                        httpGet:
                          path: /api/health/
                          port: 8000
                        initialDelaySeconds: 10
                        periodSeconds: 5
                      env:
                        - name: CORS_ALLOWED_ORIGINS
                          value: "http://$AWS_EC2_IP:3000,http://localhost:3000"
                        - name: CSRF_TRUSTED_ORIGINS
                          value: "http://$AWS_EC2_IP:3000,http://localhost:3000"
                      envFrom:
                        - secretRef:
                            name: backend-secrets
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: backend
              namespace: immobilier
            spec:
              type: NodePort
              selector:
                app: backend
              ports:
                - protocol: TCP
                  port: 8000
                  targetPort: 8000
                  nodePort: 8000
            EOF
            
            echo "🚀 Application du déploiement backend..."
            cat backend-deployment.yaml | grep image  # Vérification : l'image doit être résolue, pas littérale
            sudo k3s kubectl apply -f backend-deployment.yaml
            
            echo "⏳ Attente du démarrage (timeout 3 min)..."
            sudo k3s kubectl rollout status deployment/backend -n immobilier --timeout=180s \
              && echo "✅ Backend déployé avec succès !" \
              || (echo "❌ ERREUR déploiement backend !" && sudo k3s kubectl describe pod -n immobilier -l app=backend && exit 1)
            
            # ─────────────────────────────────────────────────────
            #  Auto-Scaling (HPA) — Activé uniquement si
            #  le secret GitHub ENABLE_HPA=true est défini.
            #  Sur t3.small : ne pas activer (ressources insuffisantes)
            #  Sur une vraie infra : ajouter ENABLE_HPA=true dans
            #  Settings → Secrets and variables → Actions
            # ─────────────────────────────────────────────────────
            if [ "$ENABLE_HPA" = "true" ]; then
              echo "✅ ENABLE_HPA=true détecté — Application du HPA..."
              cat << 'EOF' > hpa.yaml
            apiVersion: autoscaling/v2
            kind: HorizontalPodAutoscaler
            metadata:
              name: backend-hpa
              namespace: immobilier
            spec:
              scaleTargetRef:
                apiVersion: apps/v1
                kind: Deployment
                name: backend
              minReplicas: 1
              maxReplicas: 3
              metrics:
                - type: Resource
                  resource:
                    name: cpu
                    target:
                      type: Utilization
                      averageUtilization: 70
                - type: Resource
                  resource:
                    name: memory
                    target:
                      type: Utilization
                      averageUtilization: 80
              behavior:
                scaleUp:
                  stabilizationWindowSeconds: 60
                  policies:
                    - type: Pods
                      value: 1
                      periodSeconds: 60
                scaleDown:
                  stabilizationWindowSeconds: 300
                  policies:
                    - type: Pods
                      value: 1
                      periodSeconds: 120
            EOF
              sudo k3s kubectl apply -f hpa.yaml
              echo "✅ HPA backend appliqué avec succès !"
            else
              echo "ℹ️  ENABLE_HPA non défini — HPA ignoré (mode économie de ressources)"
            fi
