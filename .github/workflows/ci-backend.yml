name: CI - Gestion Immobilier Back-end
on:
  push:
    branches: [main]
    paths:
      - 'Back-end/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Back-end/**'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gestion_immobilier_back_end
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gestion_immobilier_back_end"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: test-secret-key
      DEBUG: "True"
      DB_NAME: gestion_immobilier_back_end
      DB_USER: postgres
      DB_PASSWORD: ""
      DB_HOST: localhost
      DB_PORT: "5432"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      TIME_ZONE: UTC
      ACCESS_TOKEN_LIFETIME_MIN: "30"
      REFRESH_TOKEN_LIFETIME_DAYS: "7"
      FRONTEND_URL: http://localhost:3000
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: noreply@local.test

    defaults:
      run:
        working-directory: ./Back-end/configuration

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Vérifier la configuration Django
        run: python manage.py check

      - name: Lancer les tests Django
        run: python manage.py test

      - name: Sauvegarder le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Back-end/configuration/coverage.xml

  code-quality:
    needs: backend-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupérer le rapport de couverture
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: Back-end/configuration/

      - name: Analyse SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: ./Back-end/configuration
          args: >-
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/test_*.py,**/tests.py,**/tests_*.py,test_reporting.py
            -Dsonar.python.version=3.11
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=**/migrations/**,**/__pycache__/**,**/.pytest_cache/**,manage.py,**/settings.py,settings.py,wsgi.py,asgi.py,**/test_*.py,**/tests.py,**/tests_*.py,test_reporting.py,test_runner.py,performance_test.py,check_user.py,scratch/**,**/media/**,coverage.xml,.coverage,**/*.log,**/*.txt,**/.venv/**,**/venv/**
            -Dsonar.cpd.exclusions=**/migrations/**,**/test_*.py,**/tests.py,**/tests_*.py,test_reporting.py,**/admin.py,**/apps.py,**/urls.py
            -Dsonar.coverage.exclusions=**/migrations/**,**/test_*.py,**/tests.py,**/tests_*.py,test_reporting.py,test_runner.py,performance_test.py,check_user.py,scratch/**,manage.py,**/settings.py,settings.py,wsgi.py,asgi.py,**/admin.py,**/apps.py,**/urls.py,**/__init__.py
            -Dsonar.sourceEncoding=UTF-8

  docker-publish:
    needs: [backend-tests, code-quality]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/immobilier-drf

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Back-end/configuration
          file: ./Back-end/configuration/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/immobilier-drf:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/immobilier-drf:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploiement-AWS:
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion et déploiement sur AWS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_HOST: ${{ secrets.AWS_RDS_ENDPOINT }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_NAME: "gestion-immobilier"
          DB_USER: "postgres"
          DB_PORT: "5432"
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          AWS_EC2_IP: ${{ secrets.AWS_EC2_IP }}
        with:
          host: ${{ secrets.AWS_EC2_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          envs: DB_HOST, DB_PASSWORD, SECRET_KEY, DB_NAME, DB_USER, DB_PORT, DOCKERHUB_USERNAME, AWS_EC2_IP
          script: |
            mkdir -p /home/ubuntu/gestion-immobilier
            cd /home/ubuntu/gestion-immobilier
            
            cat << EOF > .env
            DB_HOST=$DB_HOST
            DB_NAME=$DB_NAME
            DB_USER=$DB_USER
            DB_PASSWORD=$DB_PASSWORD
            DB_PORT=$DB_PORT
            SECRET_KEY=$SECRET_KEY
            DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME
            ALLOWED_HOSTS=*
            CORS_ALLOWED_ORIGINS=http://$AWS_EC2_IP:3000,http://localhost:3000
            CSRF_TRUSTED_ORIGINS=http://$AWS_EC2_IP:3000,http://localhost:3000
            EOF
            
            cat << 'EOF' > docker-compose.yml
            services:
              web:
                image: didierherlin/immobilier-drf:latest
                restart: unless-stopped
                env_file:
                  - .env
                ports:
                  - "8000:8000"
                command: >-
                  sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

              frontend:
                image: didierherlin/login-page-immobilier:latest
                restart: unless-stopped
                ports:
                  - "3000:3000"
                depends_on:
                  - web
            EOF
            
            sudo docker compose pull
            sudo docker compose up -d
