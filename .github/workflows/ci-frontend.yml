name: CI - Frontend Gestion immobilier

on:
  push:
    branches: [main]
    paths:
      - 'Front/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Front/**'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Front

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Activer pnpm via corepack
        run: corepack enable pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: './Front/pnpm-lock.yaml'

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm run build

  docker-publish:
    needs: frontend-build
    runs-on: ubuntu-latest
    outputs:
      ec2_ip: ${{ steps.resolve-ip.outputs.ec2_ip }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Résoudre l'adresse IP cible de l'EC2
        id: resolve-ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          STATIC_IP: ${{ secrets.AWS_EC2_IP }}
        run: |
          TARGET_IP="$STATIC_IP"
          if [ -n "$AWS_INSTANCE_ID" ] && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "🔍 Détection dynamique de l'IP EC2 via AWS CLI..."
            DYNAMIC_IP=$(aws ec2 describe-instances \
              --instance-ids "$AWS_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Reservations[0].Instances[0].PublicIpAddress" \
              --output text 2>/dev/null || echo "")
            if [ -n "$DYNAMIC_IP" ] && [ "$DYNAMIC_IP" != "None" ]; then
              echo "✅ IP dynamique AWS détectée : $DYNAMIC_IP"
              TARGET_IP="$DYNAMIC_IP"
            fi
          fi
          if [ -z "$TARGET_IP" ]; then
            echo "❌ ERREUR : Aucune adresse IP trouvée. Veuillez renseigner AWS_EC2_IP ou AWS_INSTANCE_ID."
            exit 1
          fi
          echo "🌐 IP utilisée : $TARGET_IP"
          echo "ec2_ip=$TARGET_IP" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Front
          file: ./Front/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ steps.resolve-ip.outputs.ec2_ip }}:8000/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploiement-AWS:
    needs: docker-publish
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion et déploiement sur AWS
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_EC2_IP: ${{ needs.docker-publish.outputs.ec2_ip }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier:${{ github.sha }}
        with:
          host: ${{ needs.docker-publish.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          envs: AWS_EC2_IP, DOCKERHUB_USERNAME, DOCKER_IMAGE
          script: |
            # ── Mode verbose : affiche chaque commande + stoppe sur erreur ──
            set -ex

            # Installation automatique de k3s s'il n'est pas présent
            if ! command -v k3s &> /dev/null; then
                echo "Installation de K3s..."
                curl -sfL https://get.k3s.io | sh - 2>&1 | tail -5
                sleep 10
            else
                echo "✅ K3s déjà installé : $(k3s --version)"
            fi
            
            # Création du namespace
            echo "🔧 Création du namespace immobilier..."
            sudo k3s kubectl create namespace immobilier --dry-run=client -o yaml | sudo k3s kubectl apply -f -
            
            # Création à la volée du fichier de déploiement optimisé pour le frontend
            # NOTE : heredoc SANS guillemets autour de EOF → $DOCKER_IMAGE est interpolé par le shell
            cat << EOF > frontend-deployment.yaml
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: frontend
              namespace: immobilier
            spec:
              replicas: 1
              strategy:
                type: RollingUpdate
                rollingUpdate:
                  maxSurge: 1
                  maxUnavailable: 0
              selector:
                matchLabels:
                  app: frontend
              template:
                metadata:
                  labels:
                    app: frontend
                spec:
                  containers:
                    - name: frontend
                      image: $DOCKER_IMAGE
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 3000
                      resources:
                        requests:
                          memory: "150Mi"
                          cpu: "100m"
                        limits:
                          memory: "256Mi"
                          cpu: "400m"
                      readinessProbe:
                        httpGet:
                          path: /
                          port: 3000
                        initialDelaySeconds: 15
                        periodSeconds: 10
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: frontend
              namespace: immobilier
            spec:
              type: NodePort
              selector:
                app: frontend
              ports:
                - protocol: TCP
                  port: 3000
                  targetPort: 3000
                  nodePort: 3000
            EOF
            
            echo "🚀 Application du déploiement frontend..."
            cat frontend-deployment.yaml | grep image  # Vérification : l'image doit être résolue, pas littérale
            sudo k3s kubectl apply -f frontend-deployment.yaml
            
            echo "⏳ Attente du démarrage (timeout 3 min)..."
            sudo k3s kubectl rollout status deployment/frontend -n immobilier --timeout=180s \
              && echo "✅ Frontend déployé avec succès !" \
              || (echo "❌ ERREUR déploiement frontend !" && sudo k3s kubectl describe pod -n immobilier -l app=frontend && sudo k3s kubectl logs -n immobilier -l app=frontend --tail=50 && exit 1)
