name: CI - Frontend Gestion immobilier

on:
  push:
    branches: [main]
    paths:
      - 'Front/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Front/**'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Front

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Activer pnpm via corepack
        run: corepack enable pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: './Front/pnpm-lock.yaml'

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm run build

  docker-publish:
    needs: frontend-build
    runs-on: ubuntu-latest
    outputs:
      ec2_ip: ${{ steps.resolve_ip.outputs.ec2_ip }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Résoudre l'adresse IP cible de l'EC2
        id: resolve_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          STATIC_IP: ${{ secrets.AWS_EC2_IP }}
        run: bash .github/scripts/resolve_ip.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Front
          file: ./Front/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ steps.resolve_ip.outputs.ec2_ip }}:8000/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploiement-AWS:
    needs: docker-publish
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    concurrency:
      group: aws-ec2-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Résoudre l'adresse IP cible de l'EC2
        id: resolve_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          STATIC_IP: ${{ secrets.AWS_EC2_IP }}
          PREV_IP: ${{ needs.docker-publish.outputs.ec2_ip }}
        run: bash .github/scripts/resolve_ip.sh

      - name: Transférer les manifestes k8s sur le serveur EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.resolve_ip.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "k8s/*"
          target: "/home/ubuntu/k8s"
          strip_components: 1
          overwrite: true

      - name: Connexion et déploiement sur AWS
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_EC2_IP: ${{ steps.resolve_ip.outputs.ec2_ip }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier:${{ github.sha }}
        with:
          host: ${{ steps.resolve_ip.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          envs: AWS_EC2_IP, DOCKERHUB_USERNAME, DOCKER_IMAGE
          script: bash /home/ubuntu/k8s/deploy-frontend.sh
