name: CI - Frontend Gestion immobilier

on:
  push:
    branches: [main]
    paths:
      - 'Front/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Front/**'
      - '.github/workflows/ci-frontend.yml'

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Front

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Activer pnpm via corepack
        run: corepack enable pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: './Front/pnpm-lock.yaml'

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm run build

  docker-publish:
    needs: frontend-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Front
          file: ./Front/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ secrets.AWS_EC2_IP }}:8000/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploiement-AWS:
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion et déploiement sur AWS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_HOST: ${{ secrets.AWS_RDS_ENDPOINT }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_NAME: "postgres"
          DB_USER: "postgres"
          DB_PORT: "5432"
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          AWS_EC2_IP: ${{ secrets.AWS_EC2_IP }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier:${{ github.sha }}
        with:
          host: ${{ secrets.AWS_EC2_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          envs: DB_HOST, DB_PASSWORD, SECRET_KEY, DB_NAME, DB_USER, DB_PORT, DOCKERHUB_USERNAME, AWS_EC2_IP, DOCKER_IMAGE
          script: |
            # Installation automatique de k3s s'il n'est pas présent
            if ! command -v k3s &> /dev/null; then
                curl -sfL https://get.k3s.io | sh -
            fi
            
            # Création du namespace
            sudo k3s kubectl create namespace immobilier --dry-run=client -o yaml | sudo k3s kubectl apply -f -
            
            # Création à la volée du fichier de déploiement optimisé pour le frontend
            cat << 'EOF' > frontend-deployment.yaml
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: frontend
              namespace: immobilier
            spec:
              replicas: 1
              strategy:
                type: RollingUpdate
              selector:
                matchLabels:
                  app: frontend
              template:
                metadata:
                  labels:
                    app: frontend
                spec:
                  containers:
                    - name: frontend
                      image: $DOCKER_IMAGE
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 3000
                      resources:
                        requests:
                          memory: "256Mi"
                          cpu: "100m"
                        limits:
                          memory: "512Mi"
                          cpu: "500m"
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: frontend
              namespace: immobilier
            spec:
              type: LoadBalancer
              selector:
                app: frontend
              ports:
                - protocol: TCP
                  port: 3000
                  targetPort: 3000
            EOF
            
            # Application du déploiement
            sudo k3s kubectl apply -f frontend-deployment.yaml
            
            # Attendre que le déploiement soit terminé (Zero downtime)
            sudo k3s kubectl rollout status deployment/frontend -n immobilier
