name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: "Composant à tester et déployer"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend
          - frontend

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 0. DÉTECTION DES MODIFICATIONS (Change Detection / Path Filtering)
  # ═══════════════════════════════════════════════════════════════════════════
  detect-changes:
    name: Détection des modifications
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.resolve.outputs.backend }}
      frontend: ${{ steps.resolve.outputs.frontend }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filtrage par chemins modifiés
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Back-end/**'
              - 'k8s/backend.yaml'
              - 'k8s/deploy-backend.sh'
              - 'k8s/k3s-secret.yaml'
              - 'k8s/namespace.yaml'
              - 'k8s/hpa.yaml'
            frontend:
              - 'Front/**'
              - 'k8s/frontend.yaml'
              - 'k8s/deploy-frontend.sh'

      - name: Résolution finale des cibles (Support Push & Workflow Dispatch)
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.component }}" = "backend" ]; then
              echo "backend=true" >> "$GITHUB_OUTPUT"
              echo "frontend=false" >> "$GITHUB_OUTPUT"
            elif [ "${{ inputs.component }}" = "frontend" ]; then
              echo "backend=false" >> "$GITHUB_OUTPUT"
              echo "frontend=true" >> "$GITHUB_OUTPUT"
            else
              echo "backend=true" >> "$GITHUB_OUTPUT"
              echo "frontend=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # 1. BRANCHE BACKEND (Indépendante du Frontend)
  # ═══════════════════════════════════════════════════════════════════════════
  backend-tests:
    name: Backend - Tests & Couverture
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gestion_immobilier_back_end
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gestion_immobilier_back_end"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --tmpfs /var/lib/postgresql/data:rw

    env:
      SECRET_KEY: test-secret-key
      DEBUG: "True"
      DB_NAME: gestion_immobilier_back_end
      DB_USER: postgres
      DB_PASSWORD: ""
      DB_HOST: localhost
      DB_PORT: "5432"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      TIME_ZONE: UTC
      ACCESS_TOKEN_LIFETIME_MIN: "30"
      REFRESH_TOKEN_LIFETIME_DAYS: "7"
      FRONTEND_URL: http://localhost:3000
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: noreply@local.test

    defaults:
      run:
        working-directory: ./Back-end/configuration

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Vérifier la configuration Django
        run: python manage.py check

      - name: Lancer les tests Django et couverture
        run: |
          set -e
          coverage run manage.py test

      - name: Sauvegarder le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Back-end/configuration/coverage.xml

  backend-quality:
    name: Backend - SonarQube
    needs: [detect-changes, backend-tests]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupérer le rapport de couverture
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: Back-end/configuration/

      - name: Analyse SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: ./Back-end/configuration
          args: >-
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/test_*.py,**/tests.py,**/test.py,**/tests_*.py,test_reporting.py
            -Dsonar.python.version=3.11
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=**/migrations/**,**/__pycache__/**,**/.pytest_cache/**,manage.py,**/settings.py,settings.py,wsgi.py,asgi.py,wait_for_db.py,**/test_*.py,**/tests.py,**/test.py,**/tests_*.py,test_reporting.py,test_runner.py,performance_test.py,check_user.py,profile_biens.py,scratch/**,**/media/**,coverage.xml,.coverage,**/*.log,**/*.txt,**/.venv/**,**/venv/**
            -Dsonar.cpd.exclusions=**/migrations/**,**/test_*.py,**/tests.py,**/test.py,**/tests_*.py,test_reporting.py,**/admin.py,**/apps.py,**/urls.py
            -Dsonar.coverage.exclusions=**/migrations/**,**/test_*.py,**/tests.py,**/test.py,**/tests_*.py,test_reporting.py,test_runner.py,performance_test.py,check_user.py,profile_biens.py,wait_for_db.py,scratch/**,manage.py,**/settings.py,settings.py,wsgi.py,asgi.py,**/admin.py,**/apps.py,**/urls.py,**/__init__.py,**/signals.py,**/models.py,**/validators.py,**/permissions.py
            -Dsonar.sourceEncoding=UTF-8

  backend-docker:
    name: Backend - Build & Push Docker
    needs: [detect-changes, backend-tests, backend-quality]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Back-end/configuration
          file: ./Back-end/configuration/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/immobilier-drf:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/immobilier-drf:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: Backend - Déploiement AWS (RDS & K3s)
    needs: [detect-changes, backend-docker]
    if: needs.detect-changes.outputs.backend == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    concurrency:
      group: aws-ec2-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Résoudre l'adresse IP cible de l'EC2
        id: resolve_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          STATIC_IP: ${{ secrets.AWS_EC2_IP }}
        run: bash .github/scripts/resolve_ip.sh

      - name: Transférer les manifestes k8s sur le serveur EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.resolve_ip.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "k8s/*"
          target: "/home/ubuntu/k8s"
          strip_components: 1
          overwrite: true

      - name: Connexion et déploiement du Backend sur AWS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_HOST: ${{ secrets.AWS_RDS_ENDPOINT }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_NAME: "postgres"
          DB_USER: "postgres"
          DB_PORT: "5432"
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          AWS_EC2_IP: ${{ steps.resolve_ip.outputs.ec2_ip }}
          ENABLE_HPA: ${{ secrets.ENABLE_HPA }}
          GIT_SHA: ${{ github.sha }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/immobilier-drf:${{ github.sha }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
        with:
          host: ${{ steps.resolve_ip.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          envs: DB_HOST, DB_PASSWORD, SECRET_KEY, DB_NAME, DB_USER, DB_PORT, DOCKERHUB_USERNAME, AWS_EC2_IP, ENABLE_HPA, GIT_SHA, DOCKER_IMAGE, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD
          script: bash /home/ubuntu/k8s/deploy-backend.sh

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. BRANCHE FRONTEND (100% Indépendante, sans attente du Backend)
  # ═══════════════════════════════════════════════════════════════════════════
  frontend-build:
    name: Frontend - Build Next.js
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Front

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Activer pnpm via corepack
        run: corepack enable pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: './Front/pnpm-lock.yaml'

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm run build

  frontend-docker:
    name: Frontend - Build & Push Docker
    needs: [detect-changes, frontend-build]
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    outputs:
      ec2_ip: ${{ steps.resolve_ip.outputs.ec2_ip }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Résoudre l'adresse IP cible de l'EC2
        id: resolve_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          STATIC_IP: ${{ secrets.AWS_EC2_IP }}
        run: bash .github/scripts/resolve_ip.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Front
          file: ./Front/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ steps.resolve_ip.outputs.ec2_ip }}:8000/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend:
    name: Frontend - Déploiement AWS (K3s)
    needs: [detect-changes, frontend-docker]
    if: needs.detect-changes.outputs.frontend == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    concurrency:
      group: aws-ec2-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Résoudre l'adresse IP cible de l'EC2
        id: resolve_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          STATIC_IP: ${{ secrets.AWS_EC2_IP }}
          PREV_IP: ${{ needs.frontend-docker.outputs.ec2_ip }}
        run: bash .github/scripts/resolve_ip.sh

      - name: Transférer les manifestes k8s sur le serveur EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.resolve_ip.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "k8s/*"
          target: "/home/ubuntu/k8s"
          strip_components: 1
          overwrite: true

      - name: Connexion et déploiement du Frontend sur AWS
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_EC2_IP: ${{ steps.resolve_ip.outputs.ec2_ip }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier:${{ github.sha }}
        with:
          host: ${{ steps.resolve_ip.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          envs: AWS_EC2_IP, DOCKERHUB_USERNAME, DOCKER_IMAGE
          script: bash /home/ubuntu/k8s/deploy-frontend.sh
