name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  workflow_dispatch:
    inputs:
      component:
        description: "Composant à tester et déployer"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend
          - frontend

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 0. DÉTECTION DES MODIFICATIONS (Change Detection / Path Filtering)
  # ═══════════════════════════════════════════════════════════════════════════
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend_py: ${{ steps.resolve.outputs.backend_py }}
      backend_docker: ${{ steps.resolve.outputs.backend_docker }}
      backend_deploy: ${{ steps.resolve.outputs.backend_deploy }}
      django_test_targets: ${{ steps.resolve.outputs.django_test_targets }}
      frontend_code: ${{ steps.resolve.outputs.frontend_code }}
      frontend_deploy: ${{ steps.resolve.outputs.frontend_deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend_py:
              - 'Back-end/**/*.py'
              - 'Back-end/**/requirements.txt'
            backend_docker:
              - 'Back-end/**'
            backend_k8s:
              - 'k8s/backend.yaml'
              - 'k8s/deploy-backend.sh'
              - 'k8s/k3s-secret.yaml'
              - 'k8s/namespace.yaml'
              - 'k8s/hpa.yaml'
            frontend_code:
              - 'Front/**'
            frontend_k8s:
              - 'k8s/frontend.yaml'
              - 'k8s/deploy-frontend.sh'

      - name: Resolve targets
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.component }}" = "backend" ]; then
              echo "backend_py=true" >> "$GITHUB_OUTPUT"
              echo "backend_docker=true" >> "$GITHUB_OUTPUT"
              echo "backend_deploy=true" >> "$GITHUB_OUTPUT"
              echo "frontend_code=false" >> "$GITHUB_OUTPUT"
              echo "frontend_deploy=false" >> "$GITHUB_OUTPUT"
            elif [ "${{ inputs.component }}" = "frontend" ]; then
              echo "backend_py=false" >> "$GITHUB_OUTPUT"
              echo "backend_docker=false" >> "$GITHUB_OUTPUT"
              echo "backend_deploy=false" >> "$GITHUB_OUTPUT"
              echo "frontend_code=true" >> "$GITHUB_OUTPUT"
              echo "frontend_deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "backend_py=true" >> "$GITHUB_OUTPUT"
              echo "backend_docker=true" >> "$GITHUB_OUTPUT"
              echo "backend_deploy=true" >> "$GITHUB_OUTPUT"
              echo "frontend_code=true" >> "$GITHUB_OUTPUT"
              echo "frontend_deploy=true" >> "$GITHUB_OUTPUT"
            fi
            echo "django_test_targets=" >> "$GITHUB_OUTPUT"
          else
            B_PY="${{ steps.filter.outputs.backend_py }}"
            B_DOCKER="${{ steps.filter.outputs.backend_docker }}"
            B_K8S="${{ steps.filter.outputs.backend_k8s }}"
            F_CODE="${{ steps.filter.outputs.frontend_code }}"
            F_K8S="${{ steps.filter.outputs.frontend_k8s }}"

            echo "backend_py=${B_PY}" >> "$GITHUB_OUTPUT"
            echo "backend_docker=${B_DOCKER}" >> "$GITHUB_OUTPUT"

            if [ "$B_DOCKER" = "true" ] || [ "$B_K8S" = "true" ]; then
              echo "backend_deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "backend_deploy=false" >> "$GITHUB_OUTPUT"
            fi

            echo "frontend_code=${F_CODE}" >> "$GITHUB_OUTPUT"

            if [ "$F_CODE" = "true" ] || [ "$F_K8S" = "true" ]; then
              echo "frontend_deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "frontend_deploy=false" >> "$GITHUB_OUTPUT"
            fi

            # Détermination ciblée des tests Django
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "django_test_targets=" >> "$GITHUB_OUTPUT"
            else
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- Back-end/ 2>/dev/null || true)
              CRITICAL_TOUCHED=false
              if echo "$CHANGED_FILES" | grep -qE "requirements\.txt|settings\.py|manage\.py|test_runner\.py|utilisateur/|contrats/|paiement/|bien/"; then
                CRITICAL_TOUCHED=true
              fi

              if [ "$CRITICAL_TOUCHED" = "true" ] || [ -z "$CHANGED_FILES" ]; then
                echo "django_test_targets=" >> "$GITHUB_OUTPUT"
              else
                TARGETS=()
                for APP in Status Transaction TypeBien notifications reservation; do
                  if echo "$CHANGED_FILES" | grep -qE "Back-end/configuration/${APP}/"; then
                    TARGETS+=("$APP")
                  fi
                done

                if [ ${#TARGETS[@]} -gt 0 ]; then
                  echo "django_test_targets=${TARGETS[*]}" >> "$GITHUB_OUTPUT"
                else
                  echo "django_test_targets=" >> "$GITHUB_OUTPUT"
                fi
              fi
            fi
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # 1. BRANCHE BACKEND (Tests, Qualité, Conteneurisation & Déploiement)
  # ═══════════════════════════════════════════════════════════════════════════
  backend-tests:
    name: Backend Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_py == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gestion_immobilier_back_end
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gestion_immobilier_back_end"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
          --tmpfs /var/lib/postgresql/data:rw

    env:
      SECRET_KEY: test-secret-key
      DEBUG: "True"
      DB_NAME: gestion_immobilier_back_end
      DB_USER: postgres
      DB_PASSWORD: ""
      DB_HOST: localhost
      DB_PORT: "5432"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      TIME_ZONE: UTC
      ACCESS_TOKEN_LIFETIME_MIN: "30"
      REFRESH_TOKEN_LIFETIME_DAYS: "7"
      FRONTEND_URL: http://localhost:3000
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: noreply@local.test

    defaults:
      run:
        working-directory: ./Back-end/configuration

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './Back-end/configuration/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Check Django configuration
        run: python manage.py check

      - name: Run Django tests and coverage
        run: |
          TARGETS="${{ needs.detect-changes.outputs.django_test_targets }}"
          if [ -n "$TARGETS" ]; then
            python manage.py test $TARGETS --noinput
          else
            python manage.py test --noinput
          fi

      - name: Upload coverage report
        if: hashFiles('Back-end/configuration/coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Back-end/configuration/coverage.xml
          retention-days: 1

  backend-quality:
    name: SonarQube Quality Gate
    needs: [detect-changes, backend-tests]
    if: needs.detect-changes.outputs.backend_py == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('Back-end/configuration/requirements.txt') }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Download coverage report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report
          path: Back-end/configuration/

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: ./Back-end/configuration
          args: >-
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.scm.revision=${{ github.sha }}
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/test_*.py,**/tests.py,**/test.py,**/tests_*.py,test_reporting.py
            -Dsonar.python.version=3.11
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=**/migrations/**,**/__pycache__/**,**/.pytest_cache/**,manage.py,**/settings.py,settings.py,wsgi.py,asgi.py,wait_for_db.py,**/test_*.py,**/tests.py,**/test.py,**/tests_*.py,test_reporting.py,test_runner.py,performance_test.py,check_user.py,profile_biens.py,scratch/**,**/media/**,coverage.xml,.coverage,**/*.log,**/*.txt,**/.venv/**,**/venv/**
            -Dsonar.cpd.exclusions=**/migrations/**,**/test_*.py,**/tests.py,**/test.py,**/tests_*.py,test_reporting.py,**/admin.py,**/apps.py,**/urls.py
            -Dsonar.coverage.exclusions=**/migrations/**,**/test_*.py,**/tests.py,**/test.py,**/tests_*.py,test_reporting.py,test_runner.py,performance_test.py,check_user.py,profile_biens.py,wait_for_db.py,scratch/**,manage.py,**/settings.py,settings.py,wsgi.py,asgi.py,**/admin.py,**/apps.py,**/urls.py,**/__init__.py,**/signals.py,**/models.py,**/validators.py,**/permissions.py
            -Dsonar.sourceEncoding=UTF-8

  backend-docker:
    name: Backend Docker Build
    needs: [detect-changes, backend-tests, backend-quality]
    if: needs.detect-changes.outputs.backend_docker == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Back-end/configuration
          file: ./Back-end/configuration/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/immobilier-drf:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/immobilier-drf:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy-backend:
    name: Deploy Backend
    needs: [detect-changes, backend-quality, backend-docker]
    if: always() && needs.detect-changes.outputs.backend_deploy == 'true' && (needs.backend-docker.result == 'success' || needs.backend-docker.result == 'skipped') && (needs.backend-quality.result == 'success' || needs.backend-quality.result == 'skipped') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    concurrency:
      group: aws-ec2-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve EC2 IP address
        id: resolve_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          STATIC_IP: ${{ secrets.AWS_EC2_IP }}
        run: bash .github/scripts/resolve_ip.sh

      - name: Copy Kubernetes manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.resolve_ip.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "k8s/*"
          target: "/home/ubuntu/k8s"
          strip_components: 1
          overwrite: true

      - name: Deploy backend to AWS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_HOST: ${{ secrets.AWS_RDS_ENDPOINT }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_NAME: "postgres"
          DB_USER: "postgres"
          DB_PORT: "5432"
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          AWS_EC2_IP: ${{ steps.resolve_ip.outputs.ec2_ip }}
          ENABLE_HPA: ${{ secrets.ENABLE_HPA }}
          GIT_SHA: ${{ github.sha }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/immobilier-drf:${{ needs.backend-docker.result == 'success' && github.sha || 'latest' }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
        with:
          host: ${{ steps.resolve_ip.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          envs: DB_HOST, DB_PASSWORD, SECRET_KEY, DB_NAME, DB_USER, DB_PORT, DOCKERHUB_USERNAME, AWS_EC2_IP, ENABLE_HPA, GIT_SHA, DOCKER_IMAGE, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD
          script: bash /home/ubuntu/k8s/deploy-backend.sh

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. BRANCHE FRONTEND (100% Indépendante, sans attente du Backend)
  # ═══════════════════════════════════════════════════════════════════════════
  frontend-build:
    name: Frontend Build
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_code == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Front

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable pnpm via Corepack
        run: corepack enable pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: './Front/pnpm-lock.yaml'

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: ./Front/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('./Front/pnpm-lock.yaml') }}-${{ hashFiles('./Front/**/*.ts', './Front/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('./Front/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm run build

  frontend-docker:
    name: Frontend Docker Build
    needs: [detect-changes, frontend-build]
    if: needs.detect-changes.outputs.frontend_code == 'true'
    runs-on: ubuntu-latest
    outputs:
      ec2_ip: ${{ steps.resolve_ip.outputs.ec2_ip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve EC2 IP address
        id: resolve_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          STATIC_IP: ${{ secrets.AWS_EC2_IP }}
        run: bash .github/scripts/resolve_ip.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Front
          file: ./Front/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ steps.resolve_ip.outputs.ec2_ip }}:8000/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-frontend:
    name: Deploy Frontend
    needs: [detect-changes, frontend-docker]
    if: always() && needs.detect-changes.outputs.frontend_deploy == 'true' && (needs.frontend-docker.result == 'success' || needs.frontend-docker.result == 'skipped') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    concurrency:
      group: aws-ec2-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve EC2 IP address
        id: resolve_ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
          AWS_INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          STATIC_IP: ${{ secrets.AWS_EC2_IP }}
          PREV_IP: ${{ needs.frontend-docker.outputs.ec2_ip }}
        run: bash .github/scripts/resolve_ip.sh

      - name: Copy Kubernetes manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.resolve_ip.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "k8s/*"
          target: "/home/ubuntu/k8s"
          strip_components: 1
          overwrite: true

      - name: Deploy frontend to AWS
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_EC2_IP: ${{ steps.resolve_ip.outputs.ec2_ip }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/login-page-immobilier:${{ needs.frontend-docker.result == 'success' && github.sha || 'latest' }}
        with:
          host: ${{ steps.resolve_ip.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          envs: AWS_EC2_IP, DOCKERHUB_USERNAME, DOCKER_IMAGE
          script: bash /home/ubuntu/k8s/deploy-frontend.sh
