name: "Backend Security - Trivy Container Scan"

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Back-end/**'
      - '.github/workflows/backend-trivy-scan.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: trivy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-scan:
    name: "Docker Build & Trivy Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build local Docker image with Buildx Cache"
        uses: docker/build-push-action@v6
        with:
          # Détecte automatiquement ./Back-end/configuration ou ./backend selon la structure
          context: ${{ hashFiles('Back-end/configuration/Dockerfile') != '' && './Back-end/configuration' || './backend' }}
          file: ${{ hashFiles('Back-end/configuration/Dockerfile') != '' && './Back-end/configuration/Dockerfile' || './backend/Dockerfile' }}
          load: true # Charge l'image construite dans le démon Docker local pour l'analyse Trivy
          push: false # Ne pas publier avant validation de sécurité
          tags: backend-immobilier:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Étape 1 : Analyse Trivy avec export SARIF (pour l'onglet Security de GitHub)
      - name: "Run Trivy scanner (SARIF report generation)"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend-immobilier:latest'
          scan-type: 'image'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0' # Laisser à 0 ici pour garantir l'upload SARIF avant l'échec

      # Étape 2 : Publication du rapport SARIF dans GitHub Advanced Security
      - name: "Upload Trivy SARIF report to GitHub Security tab"
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-backend-docker'

      # Étape 3 : Affichage du tableau dans les logs et Porte de Sécurité bloquante (Shift-Left)
      - name: "Run Trivy scanner (Console Table & Security Gate)"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend-immobilier:latest'
          scan-type: 'image'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1' # Fait échouer le job si une CVE CRITICAL ou HIGH est trouvée
