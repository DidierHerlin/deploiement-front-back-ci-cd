# Modèle d'exemple pour le Secret Kubernetes de supervision AWS RDS PostgreSQL
# NE PAS METTRE DE MOT DE PASSE EN CLAIR DANS CE FICHIER.
# Pour créer le secret en production, utilisez la commande suivante :
# kubectl create secret generic rds-postgres-exporter-secret \
#   -n monitoring \
#   --from-literal=DATA_SOURCE_NAME="postgresql://postgres_exporter:<MOT_DE_PASSE>@gestion-immobilier.c7y6aigsos0d.eu-north-1.rds.amazonaws.com:5432/postgres?sslmode=require" \
#   --from-literal=DB_USER="postgres_exporter" \
#   --from-literal=DB_PASSWORD="<MOT_DE_PASSE>" \
#   --from-literal=DB_HOST="gestion-immobilier.c7y6aigsos0d.eu-north-1.rds.amazonaws.com" \
#   --from-literal=DB_PORT="5432" \
#   --from-literal=DB_NAME="postgres"

apiVersion: v1
kind: Secret
metadata:
  name: rds-postgres-exporter-secret
  namespace: monitoring
type: Opaque
stringData:
  DATA_SOURCE_NAME: "postgresql://postgres_exporter:CHANGEME@gestion-immobilier.c7y6aigsos0d.eu-north-1.rds.amazonaws.com:5432/postgres?sslmode=require"
  DB_USER: "postgres_exporter"
  DB_PASSWORD: "CHANGEME"
  DB_HOST: "gestion-immobilier.c7y6aigsos0d.eu-north-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "postgres"
