apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
  labels:
    app: prometheus
    component: monitoring
data:
  monitoring-alerts.yml: |
    groups:
      - name: database-alerts
        rules:
          - alert: PostgresqlDown
            expr: pg_up == 0
            for: 1m
            labels:
              severity: critical
              component: database
            annotations:
              summary: "Base de donnees AWS RDS PostgreSQL inaccessible"
              description: "L'instance PostgreSQL ne repond plus ou l'exporter ne peut plus s'y connecter depuis plus de 1 minute."

          - alert: PostgresqlExporterDown
            expr: up{job="rds-postgres-exporter"} == 0
            for: 1m
            labels:
              severity: critical
              component: database
            annotations:
              summary: "Exporter PostgreSQL indisponible"
              description: "Le pod rds-postgres-exporter ne peut pas etre scrape par Prometheus."

          - alert: PostgresqlHighConnectionUsage
            expr: (sum(pg_stat_database_numbackends) / sum(pg_settings_max_connections)) * 100 > 80
            for: 3m
            labels:
              severity: warning
              component: database
            annotations:
              summary: "Utilisation elevee des connexions PostgreSQL (> 80%)"
              description: "Le pool de connexions atteint {{ $value | printf \"%.1f\" }}% de la limite maximale (max_connections)."

          - alert: PostgresqlConnectionLimitExhaustion
            expr: (sum(pg_stat_database_numbackends) / sum(pg_settings_max_connections)) * 100 > 95
            for: 1m
            labels:
              severity: critical
              component: database
            annotations:
              summary: "Saturation imminente des connexions PostgreSQL (> 95%)"
              description: "Le nombre de connexions actives ({{ $value | printf \"%.1f\" }}%) risque de provoquer des rejets de requetes applicatives."

          - alert: PostgresqlRollbackRateHigh
            expr: sum(rate(pg_stat_database_xact_rollback[5m])) > 2
            for: 2m
            labels:
              severity: warning
              component: database
            annotations:
              summary: "Taux eleve d'annulations de transactions (Rollbacks > 2/s)"
              description: "Le taux d'annulations est de {{ $value | printf \"%.2f\" }} rollbacks/s sur 5 minutes."

          - alert: PostgresqlDeadlocksDetected
            expr: sum(increase(pg_stat_database_deadlocks[5m])) > 0
            for: 1m
            labels:
              severity: warning
              component: database
            annotations:
              summary: "Interblocage (Deadlock) detecte sur PostgreSQL"
              description: "Un ou plusieurs verrous concurrents ont provoque un deadlock sur PostgreSQL."

          - alert: PostgresqlLowCacheHitRatio
            expr: ((sum(rate(pg_stat_database_blks_hit[5m])) / (sum(rate(pg_stat_database_blks_hit[5m])) + sum(rate(pg_stat_database_blks_read[5m])))) * 100) < 85
            for: 5m
            labels:
              severity: warning
              component: database
            annotations:
              summary: "Cache Hit Ratio PostgreSQL bas (< 85%)"
              description: "Le ratio d'acces aux blocs en memoire buffer cache est descendu a {{ $value | printf \"%.1f\" }}%."

      - name: infrastructure-alerts
        rules:
          - alert: NodeCPUSaturation
            expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
            for: 5m
            labels:
              severity: warning
              component: infrastructure
            annotations:
              summary: "Saturation CPU sur l'instance K3s (> 85%)"
              description: "L'utilisation CPU moyenne depasse 85% depuis plus de 5 minutes."

          - alert: NodeMemorySaturation
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
            for: 5m
            labels:
              severity: critical
              component: infrastructure
            annotations:
              summary: "Saturation Memoire RAM critique sur le Node (> 90%)"
              description: "La memoire disponible est inferieure a 10% depuis 5 minutes."

          - alert: NodeDiskSpaceFillingUp
            expr: (node_filesystem_free_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
            for: 5m
            labels:
              severity: warning
              component: infrastructure
            annotations:
              summary: "Espace disque restant faible (< 15%)"
              description: "Le systeme de fichiers racine dispose de moins de 15% d'espace libre."

          - alert: PodCrashLoopingOrRestarts
            expr: increase(kubelet_restarted_pods_total[15m]) > 2
            for: 5m
            labels:
              severity: warning
              component: kubernetes
            annotations:
              summary: "Redemarrages frequents de pods detectes"
              description: "Plusieurs pods ont redemarre au cours des 15 dernieres minutes."

          - alert: BackendPodUnavailable
            expr: count(container_last_seen{container="backend", namespace="immobilier"}) == 0
            for: 2m
            labels:
              severity: critical
              component: application
            annotations:
              summary: "Tous les conteneurs Backend DRF sont indisponibles"
              description: "Aucun conteneur backend actif n'est detecte dans le namespace immobilier depuis 2 minutes."

          - alert: FrontendPodUnavailable
            expr: count(container_last_seen{container="frontend", namespace="immobilier"}) == 0
            for: 2m
            labels:
              severity: critical
              component: application
            annotations:
              summary: "Le conteneur Frontend Next.js est indisponible"
              description: "Aucun conteneur frontend actif n'est detecte dans le namespace immobilier depuis 2 minutes."

          - alert: PrometheusTargetMissing
            expr: up == 0
            for: 2m
            labels:
              severity: warning
              component: monitoring
            annotations:
              summary: "Cible de supervision injoignable (up == 0)"
              description: "La cible {{ $labels.job }} ({{ $labels.instance }}) ne repond plus aux scrapes Prometheus."
