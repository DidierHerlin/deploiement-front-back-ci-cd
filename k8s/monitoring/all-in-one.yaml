    \ },\n          \"noValue\": \"0\",\n          \"custom\": {\n            \"drawStyle\"\
    : \"bars\",\n            \"fillOpacity\": 70,\n            \"lineWidth\": 1\n\
    \          },\n          \"unit\": \"short\"\n        }\n      },\n      \"gridPos\"\
    : { \"h\": 7, \"w\": 24, \"x\": 0, \"y\": 5 },\n      \"id\": 14,\n      \"title\"\
    : \"Débit des Requêtes HTTP Backend en Temps Réel\",\n      \"type\": \"timeseries\"\
    ,\n      \"targets\": [\n        {\n          \"datasource\": { \"type\": \"loki\"\
    , \"uid\": \"Loki\" },\n          \"expr\": \"sum(rate({filename=~\\\".*backend.*\\\
    \"} |= \\\"HTTP\\\"[1m]))\",\n          \"legendFormat\": \"Requêtes / sec\",\n\
    \          \"queryType\": \"range\",\n          \"refId\": \"A\"\n        }\n\
    \      ]\n    },\n    {\n      \"collapsed\": false,\n      \"gridPos\": { \"\
    h\": 1, \"w\": 24, \"x\": 0, \"y\": 12 },\n      \"id\": 201,\n      \"title\"\
    : \"Flux Centralisé des Logs Applicatifs (Loki Live Stream)\",\n      \"type\"\
    : \"row\"\n    },\n    {\n      \"datasource\": { \"type\": \"loki\", \"uid\"\
    : \"Loki\" },\n      \"gridPos\": { \"h\": 12, \"w\": 24, \"x\": 0, \"y\": 13\
    \ },\n      \"id\": 15,\n      \"options\": {\n        \"dedupStrategy\": \"none\"\
    ,\n        \"enableLogDetails\": true,\n        \"prettifyLogMessage\": true,\n\
    \        \"showCommonLabels\": false,\n        \"showLabels\": true,\n       \
    \ \"sortOrder\": \"Descending\",\n        \"wrapLogMessage\": true\n      },\n\
    \      \"title\": \"Console en Direct - Logs Pods Frontend & Backend (Namespace\
    \ immobilier)\",\n      \"type\": \"logs\",\n      \"targets\": [\n        {\n\
    \          \"datasource\": { \"type\": \"loki\", \"uid\": \"Loki\" },\n      \
    \    \"expr\": \"{filename=~\\\".*immobilier.*\\\"}\",\n          \"queryType\"\
    : \"range\",\n          \"refId\": \"A\"\n        }\n      ]\n    }\n  ],\n  \"\
    refresh\": \"5s\",\n  \"schemaVersion\": 38,\n  \"style\": \"dark\",\n  \"tags\"\
    : [\"loki\", \"application\", \"devops-m2\", \"logs\"],\n  \"time\": { \"from\"\
    : \"now-15m\", \"to\": \"now\" },\n  \"timepicker\": { \"refresh_intervals\":\
    \ [\"5s\", \"10s\", \"30s\", \"1m\"] },\n  \"timezone\": \"browser\",\n  \"title\"\
    : \"2. Application & Logs en Direct - Vue Soutenance\",\n  \"uid\": \"application-logs-live\"\
    \n}\n"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.4.1
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
          value: /var/lib/grafana/dashboards/cluster-overview.json
        resources:
          requests:
            cpu: 50m
            memory: 100Mi
          limits:
            cpu: 250m
            memory: 250Mi
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
        - name: storage
          mountPath: /var/lib/grafana
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboards
        configMap:
          name: grafana-dashboards
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 3001
