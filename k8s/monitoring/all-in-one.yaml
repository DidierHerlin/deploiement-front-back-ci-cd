apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - nodes/metrics
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - extensions
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
- nonResourceURLs:
  - /metrics
  - /metrics/cadvisor
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
- kind: ServiceAccount
  name: promtail
  namespace: monitoring
data:
  prometheus.yml: "global:\n  scrape_interval: 15s\n  evaluation_interval: 15s\n \
    \ scrape_timeout: 10s\n\nscrape_configs:\n  - job_name: 'prometheus'\n    static_configs:\n\
    \      - targets: ['localhost:9090']\n\n  - job_name: 'k3s-nodes'\n    scheme:\
    \ https\n    tls_config:\n      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n\
    \      insecure_skip_verify: true\n    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n\
    \    kubernetes_sd_configs:\n      - role: node\n    relabel_configs:\n      -\
    \ action: labelmap\n        regex: __meta_kubernetes_node_label_(.+)\n      -\
    \ target_label: __address__\n        replacement: kubernetes.default.svc:443\n\
    \      - source_labels: [__meta_kubernetes_node_name]\n        regex: (.+)\n \
    \       target_label: __metrics_path__\n        replacement: /api/v1/nodes/${1}/proxy/metrics\n\
    \n  - job_name: 'k3s-cadvisor'\n    scheme: https\n    tls_config:\n      ca_file:\
    \ /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n      insecure_skip_verify:\
    \ true\n    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n\
    \    kubernetes_sd_configs:\n      - role: node\n    relabel_configs:\n      -\
    \ action: labelmap\n        regex: __meta_kubernetes_node_label_(.+)\n      -\
    \ target_label: __address__\n        replacement: kubernetes.default.svc:443\n\
    \      - source_labels: [__meta_kubernetes_node_name]\n        regex: (.+)\n \
    \       target_label: __metrics_path__\n        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor\n\
    \n  - job_name: 'node-exporter'\n    kubernetes_sd_configs:\n      - role: pod\n\
    \    relabel_configs:\n      - source_labels: [__meta_kubernetes_pod_label_app]\n\
    \        action: keep\n        regex: node-exporter\n      - source_labels: [__meta_kubernetes_pod_ip]\n\
    \        action: replace\n        target_label: __address__\n        replacement:\
    \ ${1}:9100\n\n  - job_name: 'k3s-pods'\n    kubernetes_sd_configs:\n      - role:\
    \ pod\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]\n\
    \        action: keep\n        regex: true\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]\n\
    \        action: replace\n        target_label: __metrics_path__\n        regex:\
    \ (.+)\n      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]\n\
    \        action: replace\n        regex: ([^:]+)(?::\\d+)?;(\\d+)\n        replacement:\
    \ $1:$2\n        target_label: __address__\n      - action: labelmap\n       \
    \ regex: __meta_kubernetes_pod_label_(.+)\n      - source_labels: [__meta_kubernetes_namespace]\n\
    \        action: replace\n        target_label: kubernetes_namespace\n      -\
    \ source_labels: [__meta_kubernetes_pod_name]\n        action: replace\n     \
    \   target_label: kubernetes_pod_name\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.51.0
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=3d
        - --web.enable-lifecycle
        ports:
        - containerPort: 9090
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 120Mi
          limits:
            cpu: 250m
            memory: 300Mi
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: storage
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
data:
  loki.yaml: "auth_enabled: false\n\nserver:\n  http_listen_port: 3100\n  grpc_listen_port:\
    \ 9096\n  log_level: info\n\ncommon:\n  instance_addr: 127.0.0.1\n  path_prefix:\
    \ /loki\n  storage:\n    filesystem:\n      chunks_directory: /loki/chunks\n \
    \     rules_directory: /loki/rules\n  replication_factor: 1\n  ring:\n    kvstore:\n\
    \      store: inmemory\n\nschema_config:\n  configs:\n    - from: 2024-01-01\n\
    \      store: tsdb\n      object_store: filesystem\n      schema: v13\n      index:\n\
    \        prefix: index_\n        period: 24h\n\nlimits_config:\n  reject_old_samples:\
    \ false\n  creation_grace_period: 720h\n  retention_period: 72h\n  max_query_length:\
    \ 721h\n  max_query_parallelism: 4\n\ncompactor:\n  working_directory: /loki/compactor\n\
    \  compaction_interval: 10m\n  retention_enabled: true\n  delete_request_store:\
    \ filesystem\n\nanalytics:\n  reporting_enabled: false\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:3.0.0
        args:
        - -config.file=/etc/loki/loki.yaml
        ports:
        - containerPort: 3100
          name: http
        - containerPort: 9096
          name: grpc
        resources:
          requests:
            cpu: 50m
            memory: 80Mi
          limits:
            cpu: 200m
            memory: 200Mi
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        - name: data
          mountPath: /loki
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: loki
  ports:
  - name: http
    port: 3100
    targetPort: 3100
data:
  promtail.yaml: "server:\n  http_listen_port: 9080\n  grpc_listen_port: 0\n  log_level:\
    \ info\n\npositions:\n  filename: /run/promtail-positions.yaml\n\nclients:\n \
    \ - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push\n\nscrape_configs:\n\
    \  - job_name: k3s-containers\n    static_configs:\n      - targets:\n       \
    \   - localhost\n        labels:\n          job: k3s-containers\n          __path__:\
    \ /var/log/containers/*.log\n    relabel_configs:\n      - source_labels: [__path__]\n\
    \        regex: '.*/containers/(.+)_(.+)_(.+)-[a-f0-9]+\\.log'\n        target_label:\
    \ pod\n        replacement: $1\n      - source_labels: [__path__]\n        regex:\
    \ '.*/containers/(.+)_(.+)_(.+)-[a-f0-9]+\\.log'\n        target_label: namespace\n\
    \        replacement: $2\n      - source_labels: [__path__]\n        regex: '.*/containers/(.+)_(.+)_(.+)-[a-f0-9]+\\\
    .log'\n        target_label: container\n        replacement: $3\n    pipeline_stages:\n\
    \      - cri: {}\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      tolerations:
      - effect: NoSchedule
        operator: Exists
      containers:
      - name: promtail
        image: grafana/promtail:3.0.0
        args:
        - -config.file=/etc/promtail/promtail.yaml
        resources:
          requests:
            cpu: 20m
            memory: 40Mi
          limits:
            cpu: 100m
            memory: 100Mi
        volumeMounts:
        - name: config
          mountPath: /etc/promtail
        - name: run
          mountPath: /run
        - name: pods
          mountPath: /var/log/pods
          readOnly: true
        - name: containers
          mountPath: /var/log/containers
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: promtail-config
      - name: run
        emptyDir: {}
      - name: pods
        hostPath:
          path: /var/log/pods
      - name: containers
        hostPath:
          path: /var/log/containers
data:
  dashboards.yaml: "apiVersion: 1\nproviders:\n  - name: 'soutenance'\n    orgId:\
    \ 1\n    folder: 'Projet DevOps M2'\n    type: file\n    disableDeletion: false\n\
    \    updateIntervalSeconds: 10\n    allowUiUpdates: true\n    options:\n     \
    \ path: /var/lib/grafana/dashboards\n"
