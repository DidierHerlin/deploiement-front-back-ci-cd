# --- Source: k8s\monitoring\08-rds-postgres-exporter.yaml ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rds-postgres-exporter
  namespace: monitoring
  labels:
    app: rds-postgres-exporter
    component: database-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rds-postgres-exporter
  template:
    metadata:
      labels:
        app: rds-postgres-exporter
        component: database-monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: rds-postgres-exporter-secret
                  key: DATA_SOURCE_NAME
          ports:
            - name: metrics
              containerPort: 9187
          resources:
            requests:
              cpu: 10m
              memory: 25Mi
            limits:
              cpu: 50m
              memory: 60Mi
          livenessProbe:
            httpGet:
              path: /
              port: 9187
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 9187
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rds-postgres-exporter
  namespace: monitoring
  labels:
    app: rds-postgres-exporter
    component: database-monitoring
spec:
  type: ClusterIP
  selector:
    app: rds-postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187

