apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: info

    positions:
      filename: /var/lib/promtail/positions.yaml

    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: k3s-containers
        static_configs:
          - targets:
              - localhost
            labels:
              job: k3s-containers
              __path__: /var/log/containers/*.log
        pipeline_stages:
          - cri: {}
          - regex:
              source: filename
              expression: '^/var/log/containers/(?P<pod>[^_]+)_(?P<namespace>[^_]+)_(?P<container>.+)-(?P<container_id>[a-f0-9]+)\.log$'
          - labels:
              namespace:
              pod:
              container:
          - regex:
              source: pod
              expression: '^(?P<app>[a-zA-Z0-9-]+?)(?:-[0-9a-f]{8,10}-[0-9a-z]{5}|-[0-9a-z]{5}|-[0-9]+)?$'
          - labels:
              app:
          - replace:
              expression: '(?i)(password|secret|token|authorization)(\s*[:=]\s*|\s+Bearer\s+)[^\s",]+'
              replace: '$1$2[REDACTED]'
          - labeldrop:
              - filename
              - container_id
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: promtail
          image: grafana/promtail:3.0.0
          args:
            - "-config.file=/etc/promtail/promtail.yaml"
          resources:
            requests:
              cpu: 20m
              memory: 40Mi
            limits:
              cpu: 100m
              memory: 100Mi
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: positions
              mountPath: /var/lib/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: containers
              mountPath: /var/log/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: positions
          hostPath:
            path: /var/lib/promtail
            type: DirectoryOrCreate
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: containers
          hostPath:
            path: /var/log/containers
