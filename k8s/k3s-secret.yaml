apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: immobilier
type: Opaque
stringData:
  DB_NAME: "${DB_NAME}"
  DB_USER: "${DB_USER}"
  DB_PASSWORD: "${DB_PASSWORD}"
  DB_HOST: "${DB_HOST}"
  DB_PORT: "${DB_PORT}"
  SECRET_KEY: "${SECRET_KEY}"
  ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: "http://${AWS_EC2_IP}:3000,http://${AWS_EC2_IP}:8000,http://localhost:3000,http://localhost:8000"
  CSRF_TRUSTED_ORIGINS: "http://${AWS_EC2_IP}:3000,http://${AWS_EC2_IP}:8000,http://localhost:3000,http://localhost:8000"
  EMAIL_HOST_USER: "${EMAIL_HOST_USER}"
  EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD}"
  CORS_PREFLIGHT_MAX_AGE: "86400"
