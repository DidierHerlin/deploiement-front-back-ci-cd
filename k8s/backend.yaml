apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: immobilier
data:
  DB_NAME: gesion_immobilier_back_end
  DB_USER: postgres
  DB_PASSWORD: ""
  DB_HOST: postgres
  DB_PORT: "5432"
  ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://frontend:3000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: immobilier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # A remplacer par l'image Docker Hub de l'utilisateur
          image: localhost/immobilier-drf:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: backend-config
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: immobilier
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
