apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: immobilier
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: didierherlin/immobilier-drf:latest
          imagePullPolicy: Always
          command: ["sh", "-c", "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 60 --keep-alive 5 wsgi:application"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "250Mi"
              cpu: "100m"
            limits:
              memory: "450Mi"
              cpu: "400m"
          startupProbe:
            httpGet:
              path: /api/health/
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: media-storage
              mountPath: /app/media
          envFrom:
            - secretRef:
                name: backend-secrets
      volumes:
        - name: media-storage
          hostPath:
            path: /opt/immobilier/media
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: immobilier
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 8000
