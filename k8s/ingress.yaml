apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immobilier-ingress
  namespace: immobilier
  annotations:
    # Intégration cert-manager (génération automatique des certificats SSL Let's Encrypt)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Configuration des points d'entrée Traefik et redirection HTTPS
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gestion-immobilier.duckdns.org
      secretName: frontend-tls-cert
    - hosts:
        - api-gestion-immobilier.duckdns.org
      secretName: backend-tls-cert
  rules:
    # 1. Sous-domaine Frontend Next.js
    - host: gestion-immobilier.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000

    # 2. Sous-domaine Backend Django REST Framework
    - host: api-gestion-immobilier.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
